name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.10.11'
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --extra personal
      - run: uv run --no-sync playwright install --with-deps chromium
      - run: uvx ruff==0.17.4 check --select F,E9 src tests tools
      - run: uv run --no-sync python tools/check_format_baseline.py
      - name: Check repository types against existing diagnostics
        if: matrix.python == '3.12'
        run: uv run --no-sync --with mypy==2.4.1 python tools/check_mypy_baseline.py
      - run: uv run --no-sync python -m unittest discover -s tests -t . -q
      - name: TypeScript SDK interoperability
        if: matrix.python == '3.12'
        run: |
          npm install --prefix "$RUNNER_TEMP/ntu-sdk" --ignore-scripts --no-audit --no-fund @modelcontextprotocol/sdk@1.32.1
          uv run --no-sync node tests/typescript_smoke.mjs "$RUNNER_TEMP/ntu-sdk"
