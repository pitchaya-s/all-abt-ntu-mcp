[project]
name = "all-abt-ntu-mcp"
version = "0.1.0-beta.5"
description = "MCP server for NTU schedules, learning, career opportunities, maps, research, faculty, library, news, campus services, shuttle arrivals, and student administration"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "pitchaya-s" }]
keywords = ["ntu", "mcp", "stars", "ntulearn", "shuttle", "omnibus", "careeraxis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Education",
]
requires-python = ">=3.10"
dependencies = [
    "anyio>=4,<5",
    "mcp>=2,<3",
    "starlette>=0.48,<2",
    "typing-extensions>=4.12,<5",
    "pypdf>=6.21.4,<7",
    "keyring>=25.6,<27",
    "httpx>=0.27,<1",
    "tzdata>=2025.1",
    "questionary>=2.1,<3",
]

[project.optional-dependencies]
personal = ["playwright>=1.50,<2"]
browser-cookies = ["browser-cookie3>=0.20,<1"]

[project.urls]
Homepage = "https://github.com/pitchaya-s/all-abt-ntu-mcp"
Repository = "https://github.com/pitchaya-s/all-abt-ntu-mcp"
Documentation = "https://github.com/pitchaya-s/all-abt-ntu-mcp/blob/main/README.md"
Issues = "https://github.com/pitchaya-s/all-abt-ntu-mcp/issues"

[project.scripts]
all-abt-ntu = "cli.cli:main"

[tool.hatch.build]
exclude = [
    "**/.env",
    "**/.env.*",
    "**/*.har",
    "**/cookies*.json",
    "**/storage_state*.json",
    "**/*.log",
]

[tool.hatch.build.targets.wheel]
only-include = [
    "src/careeraxis",
    "src/cli",
    "src/drntu",
    "src/faculty",
    "src/library",
    "src/mazemap",
    "src/news",
    "src/ntulearn",
    "src/omnibus",
    "src/onestop",
    "src/service",
    "src/shared",
    "src/stars",
    "src/server.py",
    "src/public_server.py",
    "src/public_http_server.py",
    "src/public_http_client.py",
]
sources = ["src"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"
