[project]
name = "all-abt-ntu-mcp"
version = "0.1.0-beta.1"
description = "MCP server for NTU schedules, learning, career opportunities, maps, research, faculty, library, news, campus services, shuttle arrivals, and student administration"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "pitchaya-s" }]
keywords = ["ntu", "mcp", "stars", "ntulearn", "shuttle", "omnibus", "careeraxis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Education",
]
requires-python = ">=3.10"
dependencies = [
    "mcp>=2,<3",
    "starlette>=0.48,<2",
    "typing-extensions>=4.12,<5",
    "pypdf>=6,<7",
    "keyring>=25.6,<27",
    "tzdata>=2025.1",
]

[project.optional-dependencies]
personal = ["playwright>=1.50,<2"]

[project.urls]
Homepage = "https://github.com/pitchaya-s/all-abt-ntu-mcp"
Repository = "https://github.com/pitchaya-s/all-abt-ntu-mcp"
Documentation = "https://github.com/pitchaya-s/all-abt-ntu-mcp/blob/main/README.md"
Issues = "https://github.com/pitchaya-s/all-abt-ntu-mcp/issues"

[project.scripts]
all-abt-ntu = "shared.cli:main"

[tool.uv.build-backend]
module-name = ["stars", "ntulearn", "mazemap", "drntu", "library", "faculty", "news", "service", "onestop", "omnibus", "careeraxis", "shared"]
source-exclude = [".env", ".env.*", "*.har", "cookies*.json", "storage_state*.json", "*.log"]

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"
