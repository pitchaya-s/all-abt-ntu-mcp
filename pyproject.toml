[project]
name = "all-abt-ntu-mcp"
version = "0.1.0"
description = "Local MCP server for NTU Singapore STARS and NTULearn"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2,<3",
    "python-dotenv>=1,<2",
    "typing-extensions>=4.12,<5",
    "pypdf>=6,<7",
]

[project.optional-dependencies]
personal = ["playwright>=1.50,<2"]

[project.scripts]
all-abt-ntu-mcp = "shared.server:main"

[tool.uv.build-backend]
module-name = ["ntu_stars_mcp", "ntulearn_mcp", "shared"]

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"
