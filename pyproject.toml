[project]
name = "ntu-stars-mcp"
version = "0.1.0"
description = "NTU Singapore course schedules and academic timetable MCP server"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2,<3",
    "python-dotenv>=1,<2",
    "typing-extensions>=4.12,<5",
]

[project.optional-dependencies]
wish = ["playwright>=1.50,<2"]

[project.scripts]
ntu-stars-mcp = "ntu_stars_mcp:main"

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"
