[project]
name = "all-abt-ntu-mcp"
version = "0.1.0"
description = "Local MCP server for NTU schedules, learning, maps, research, faculty, library, news, and campus services"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2,<3",
    "starlette>=0.48,<2",
    "typing-extensions>=4.12,<5",
    "pypdf>=6,<7",
    "keyring>=25.6,<27",
    "tzdata>=2025.1",
]

[project.optional-dependencies]
personal = ["playwright>=1.50,<2"]

[project.scripts]
all-abt-ntu = "shared.cli:main"

[tool.uv.build-backend]
module-name = ["stars", "ntulearn", "mazemap", "drntu", "library", "faculty", "news", "service", "shared"]

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"
